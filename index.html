<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3aa6f0">
<title>Обби Грамотей</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff5a3c'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23ffd23c'/%3E%3C/svg%3E">
<style>
:root{--ink:#1d2b4f;--soft:#5a6a8e;--sky:#3aa6f0;--card:#fff;--line:#d9e3f2;--red:#ef4b3f;--blue:#2f7bf0;--green:#25b35f;--yellow:#f5b70f;--purple:#8a55e6;--gold:#f5b70f;
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2d93dc;color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}
.btn3d{--c:var(--blue);--d:#1b58b8;display:block;background:var(--c);color:#fff;font-weight:800;border-radius:14px;box-shadow:0 6px 0 var(--d);transition:transform .06s,box-shadow .06s;min-height:56px;padding:12px 18px;font-size:19px;text-align:center}
.btn3d:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.btn3d[disabled]{filter:grayscale(.8);opacity:.6;cursor:default}
.btn3d.c0{--c:var(--red);--d:#b12c23}.btn3d.c1{--c:var(--blue);--d:#1b58b8}.btn3d.c2{--c:var(--green);--d:#14803f}.btn3d.c3{--c:#e8a600;--d:#a97800}.btn3d.pur{--c:var(--purple);--d:#5f33ad}.btn3d.lite{--c:#fff;--d:#c6d3e6;color:var(--ink)}

/* меню */
#menu{min-height:100dvh;background:linear-gradient(#3aa6f0,#8fd2fb 420px,#dff3ff 900px);padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-size:clamp(26px,5.4vw,42px);font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1;text-shadow:0 3px 0 #1a6cb3;flex:1}
.logo small{display:block;font-size:clamp(13px,2.2vw,16px);font-weight:700;letter-spacing:0;margin-top:6px;text-shadow:none;color:#eaf6ff}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;display:inline-flex;gap:7px;align-items:center;font-size:18px;box-shadow:0 3px 0 #1a6cb355;white-space:nowrap}
.coin{display:inline-block;width:18px;height:18px;border-radius:4px;background:var(--gold);box-shadow:inset -3px -3px 0 #c98f00,inset 3px 3px 0 #ffe27a;flex:none}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.big{position:relative;text-align:left;border-radius:18px;padding:16px 18px;min-height:112px;color:#fff;font-weight:800;overflow:hidden;box-shadow:0 7px 0 var(--d);background:var(--c);transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.big b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.big span{display:block;font-size:14px;font-weight:600;margin-top:6px;opacity:.95;line-height:1.25}
.big[disabled]{filter:grayscale(.7);opacity:.7}
.track{margin-bottom:24px}
.track h2{font-size:22px;font-weight:900;margin-bottom:3px}
.track p{color:#35476f;font-size:15px;margin-bottom:12px;font-weight:600}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.lvl{background:#fff;border-radius:14px;padding:11px 12px 9px;text-align:left;min-height:96px;box-shadow:0 5px 0 #b5c6df;display:flex;flex-direction:column;gap:5px;transition:transform .06s,box-shadow .06s}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 #b5c6df}
.lvl b{font-size:16.5px;font-weight:800;line-height:1.15;flex:1}
.lvl i{font-style:normal;font-size:13px;color:var(--soft);font-weight:700}
.stars{letter-spacing:1px;font-size:16px;color:#c9d4e5}.stars em{font-style:normal;color:var(--gold)}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.back{margin-bottom:14px;width:max-content}
.panel{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 5px 0 #b5c6df;margin-bottom:14px}
.panel h3{font-size:19px;font-weight:900;margin-bottom:6px}
.panel p{font-size:17px;line-height:1.4}
.ttl{color:#fff;font-size:30px;font-weight:900;text-shadow:0 3px 0 #1a6cb3;margin-bottom:14px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#fff;border-radius:14px;padding:10px;box-shadow:0 5px 0 #b5c6df;text-align:center;font-weight:800;font-size:15px;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:128px;justify-content:space-between}
.item.on{outline:4px solid var(--green)}
.item canvas{width:80px;height:80px}
.item small{color:var(--soft);font-weight:800;display:flex;gap:5px;align-items:center}
.item[disabled]{opacity:.6}
.stage{display:flex;justify-content:center;background:linear-gradient(#bfe6ff,#fff);border-radius:16px;margin-bottom:14px;box-shadow:0 5px 0 #b5c6df}
.cols{columns:2 240px;column-gap:14px}
.wd{display:flex;align-items:center;justify-content:space-between;gap:8px;break-inside:avoid;padding:6px 2px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700}
.wd mark{background:none;color:var(--red);font-weight:900}
.meter{height:12px;background:#e6edf7;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.meter i{display:block;height:100%;background:var(--green)}
a{color:var(--blue);font-weight:800}

/* игра */
#play{position:fixed;inset:0;display:none;overflow:hidden;background:#3aa6f0}
#play canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:10px}
.x{background:#fff;border-radius:11px;font-weight:900;padding:9px 13px;font-size:15px;box-shadow:0 3px 0 #0003}
.prog{flex:1;height:14px;background:#ffffff66;border-radius:7px;overflow:hidden;box-shadow:inset 0 2px 0 #0002;min-width:40px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
#q{background:#fffffff5;border-radius:16px;padding:12px 16px;text-align:center;box-shadow:0 5px 0 #0002;max-width:760px;width:100%;margin:0 auto}
#q .kicker{font-size:13.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.4px}
#q .ques{font-size:clamp(19px,3.1vw,25px);font-weight:800;line-height:1.25;margin-top:2px}
#q .word{font-size:clamp(31px,6.4vw,50px);font-weight:900;line-height:1.15;letter-spacing:1px;margin-top:2px;overflow-wrap:anywhere}
#q .word b{color:var(--red)}
#q .word.long{font-size:clamp(22px,4.2vw,34px);letter-spacing:.5px}
#q .note{font-size:clamp(16px,2.5vw,19px);font-weight:600;line-height:1.3;margin-top:5px;color:#32426a}
#q .ex{margin-top:6px;font-size:clamp(15px,2.3vw,18px);font-weight:700;color:#14803f}
.gap{display:inline-block;min-width:1em;padding:0 .18em;border-bottom:.12em solid var(--red);color:var(--red);line-height:1}
#ans{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#ans>*{pointer-events:auto;max-width:760px;margin-left:auto;margin-right:auto}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opts .btn3d{font-size:clamp(19px,3.2vw,25px);min-height:64px;line-height:1.12;padding:8px 10px;overflow-wrap:anywhere}
.opts.long .btn3d{font-size:clamp(16px,2.5vw,20px)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;color:var(--ink);font-weight:900;border-radius:11px;box-shadow:0 5px 0 #a8b9d3;min-width:54px;min-height:56px;font-size:27px;padding:4px 10px;transition:transform .05s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #a8b9d3}
.tile.chunk{font-size:clamp(16px,2.5vw,20px);font-weight:800;flex:1 1 40%}
.tile.used{visibility:hidden}
.tile.hint{background:#ffe27a;box-shadow:0 5px 0 #c98f00}
.tile.bad{animation:sh .28s;background:#ffc9c4}
.keys{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.keys div{display:flex;gap:4px;justify-content:center}
.keys .tile{min-width:0;flex:1 1 0;max-width:62px;min-height:48px;font-size:clamp(16px,3.4vw,23px);padding:0;box-shadow:0 3px 0 #a8b9d3;border-radius:8px}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.oops{background:#fff;border-radius:16px;padding:12px 16px 14px;box-shadow:0 5px 0 #0002}
.oops h3{font-size:21px;font-weight:900;color:var(--red)}
.oops .right{font-size:clamp(20px,3.3vw,26px);font-weight:900;margin-top:2px;overflow-wrap:anywhere}
.oops p{font-size:clamp(16px,2.4vw,18.5px);font-weight:600;line-height:1.3;margin:4px 0 10px;color:#32426a}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #0006;pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{animation:ts 1s}
@keyframes ts{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b1e4466;padding:16px}
.res{background:#fff;border-radius:20px;padding:20px 22px;text-align:center;max-width:430px;width:100%;box-shadow:0 8px 0 #0003}
.res h2{font-size:30px;font-weight:900}
.res .big3{font-size:46px;color:#d5dce8;letter-spacing:4px;line-height:1.2}.res .big3 em{font-style:normal;color:var(--gold)}
.res p{font-size:18px;font-weight:700;margin:6px 0 14px}
.res .btn3d{margin-top:10px;width:100%}
@media (max-height:520px){#q .kicker,#q .note{display:none}#q{padding:6px 12px}.opts .btn3d{min-height:48px}.tile{min-height:44px;min-width:44px;font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div id="menu"></div>
<div id="play">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar"><button class="x" data-do="quit">← Выйти</button><div class="prog"><i id="pg"></i></div><span class="pill"><span class="coin"></span><span id="cn">0</span></span><button class="x" data-do="snd" id="sb" aria-label="Звук">Звук</button></div>
    <div id="q"></div>
  </div>
  <div id="toast"></div>
  <div id="ans"></div>
  <div id="over"></div>
</div>
<script>
'use strict';
/* ===== ДАННЫЕ ===== */
/* Слово: [верно/ложно] — место-ловушка. | подсказка-значение | как запомнить */
const WORD_LEVELS=[
{id:'w1',name:'Дни недели и числа',words:`
п[о/а]н[е/и]де́льник|Первый день недели|По-недельник — день «после недели». В корне то же Е, что в слове неделя.
вто́рн[и/е]к|Второй день недели|Вторник — второй день. На конце -ИК, как в слове понедельник.
ср[е/и]да́|Третий день, середина недели|Среда — середина недели. Первая гласная в обоих словах Е.
ч[е/и]тв[е/и]́рг|Четвёртый день недели|Четверг — четвёртый. Обе гласные здесь Е.
п[я/е]́тн[и/е]ца|Пятый день недели|Пятница — пятый день, поэтому Я.
в[о/а]скр[е/и]се́н[ь/ъ]е|Седьмой день недели|Воскресенье: сначала О, потом Е и мягкий знак перед последней Е.
во́с[е/и]мь|Сколько будет 5 + 3|Восемь: во втором слоге Е, на конце мягкий знак.
ч[е/и]ты́р[е/и]|Сколько будет 2 + 2|Четыре: начало как в слове четверг, на конце тоже Е.`},
{id:'w2',name:'Огород и еда',words:`
о́в[о/а]щ[и/ы]|Морковь, лук и капуста одним словом|Два раза О, а ЩИ всегда с буквой И.
[о/а]г[о/а]ро́д|Место с грядками|В слове огород все гласные О.
[о/а]г[у/о]ре́ц|Зелёный и хрустит на грядке|О-гу-рец: первая О, вторая У.
п[о/а]м[и/е]до́р|Красный овощ, из него делают кетчуп|По-ми-дор: О, И, О.
к[а/о]рто́ф[е/и]ль|Из него делают пюре и чипсы|Кар-то-фель: первая гласная А, последняя Е.
п[е/и]тру́шка|Зелень, которую кладут в суп|Пет-руш-ка: первая гласная Е.
г[о/а]ро́[х/г]|Круглые зелёные шарики в стручке|Обе гласные О, а на конце Х.
п[и/е]ро́[г/к]|Печёный, бывает с яблоками|В начале ПИ. Проверь конец: пирога — значит, Г.
за́[в/ф]тр[а/о]к|Еда утром|Слышится Ф, а пишем В. Вторая гласная А.
у́ж[и/ы]н|Еда вечером|ЖИ пиши с буквой И.
[о/а]ре́[х/г]|Его грызёт белка|Начинается на О, заканчивается на Х.
[о/а]вё[с/з]|Зерно, которое любят лошади|Начинается на О. Проверь конец: овса — значит, С.
пш[е/ы]ни́ца|Из её зёрен делают белую муку|После Ш здесь Е: пше-ни-ца.`},
{id:'w3',name:'Природа',words:`
бе́р[е/и][г/к]|Край земли у реки или моря|Обе гласные Е. Проверь конец: берега — значит, Г.
п[е/и]со́[к/г]|Из него лепят куличики|Первая гласная Е. Проверь конец: песка — значит, К.
з[а/о]ря́|Яркий свет на небе перед восходом|За-ря: пиши А, запомни это слово.
п[о/а]ро́ша|Свежий пушистый снег|По-ро-ша: все первые гласные О.
п[о/а]го́да|Солнце, дождь или ветер за окном|По-го-да: обе первых гласных О.
се́в[е/и]р|Сторона света, где холодно|Обе гласные Е.
в[о/а]сто́[к/г]|Сторона света, где встаёт солнце|Обе гласные О. На конце К.
гв[о/а]зди́ка|Красный цветок ко Дню Победы|Гвоз-ди-ка: первая гласная О.
р[о/а]ма́шка|Цветок: белые лепестки, жёлтая серединка|Ро-маш-ка: сначала О.
р[я/е]би́на|Дерево с красными гроздьями ягод|Ря-би-на: сначала Я.
с[и/е]ре́нь|Куст с душистыми лиловыми цветами|Си-рень: сначала И, на конце мягкий знак.
[о/а]д[у/о]ва́нчик|Жёлтый цветок, который станет пушистым шариком|О-ду-ван: он будто от дуновения разлетается. Пиши О, потом У.
р[а/о]сте́н[и/е]е|Цветок, дерево или трава одним словом|Рас-те-ни-е: то, что растёт. Сначала А.
ж[и/ы]во́тное|Кот, лось и слон одним словом|ЖИ пиши с буквой И. Животное — живое.`},
{id:'w4',name:'Дом и транспорт',words:`
кв[а/о]рти́ра|Жильё в многоэтажном доме|Квар-ти-ра: сначала А.
ко́мн[а/о]та|Спальня или детская|Ком-на-та: вторая гласная А.
кр[о/а]ва́ть|На ней спят|Кро-вать: сначала О, на конце мягкий знак.
ле́[ст/с]н[и/е]ца|Ступеньки вверх и вниз|Хотя Т почти не слышно, она есть: ЛЕСТ-ни-ца.
тр[а/о]мва́[й/и]|Ездит по рельсам в городе|Трам-вай: две гласные А и Й на конце.
ш[о/а]сс[е/э]́|Широкая дорога между городами|Здесь две С и Е на конце: шос-се.
с[а/о]м[о/а]лёт|Большая машина с крыльями|САМ + ЛЁТ: сам летает. Сначала А, потом О.
р[а/о]ке́та|Летит в космос|Ра-ке-та: сначала А.
тра́кт[о/а]р|Машина, которая пашет поле|Трак-тор: на конце -ТОР.
к[о/а]мпью́т[е/э]р|На нём есть клавиатура и экран|Ком-пью-тер: сначала О, потом ЬЮ, на конце ТЕР.
а[ль/л]бо́м|Тетрадь для рисования|Здесь есть мягкий знак: АЛЬ-бом.
к[и/е]л[о/а]гра́[мм/м]|Тысяча граммов|Ки-ло-грамм: две М на конце.`},
{id:'w5',name:'Люди и Родина',words:`
г[е/и]ро́[й/и]|Смелый человек, совершивший подвиг|Ге-рой: сначала Е.
п[о/а]э́т|Пишет стихи|По-эт: сначала О, потом Э.
к[о/а][лл/л]ект[и/е]́в|Люди, которые вместе учатся или работают|Две Л: кол-лек-тив.
к[о/а][лл/л]е́кция|Собрание марок или значков|Две Л: кол-лек-ция. Как в слове коллектив.
ла́г[е/и]рь|Летом туда ездят с отрядом|Ла-герь: вторая гласная Е.
пра́[зд/з]ник|День рождения или Новый год|Д не слышно, но она есть: празДник.
чу́[вст/ст]во|Радость, страх или любовь|В не слышно, но она есть: чуВство.
[К/к]ре́м[ль/л]|Крепость в центре Москвы|С большой буквы, на конце мягкий знак.
[К/к]ра́сная пло́ща[дь/ть]|Главная площадь Москвы|Красная с большой буквы, площадь с маленькой. На конце ДЬ.
ст[о/а]ли́ца|Главный город страны|Сто-ли-ца: сначала О.`},
{id:'w6',name:'Как? Когда? Где?',words:`
а[кк/к]ура́тно|Чисто и ровно, без клякс|Две К: ак-ку-рат-но.
вме́[ст/с]е|Не врозь, а рядом друг с другом|Вме-сте: в середине СТ, обе гласные Е.
в[о/а]кру́[г/к]|Со всех сторон|Во-круг: сначала О. Проверка: круга — значит, Г.
[о/а]дна́[жд/шт]ы|Как-то раз, в один из дней|Один раз — однажды: начало то же, О. Дальше ЖД.

    SFX.win();for(let i=0;i<4;i++)burst(pad.x,pad.y-1,['#ffd23c','#ef4b3f','#2f7bf0','#25b35f','#fff'],18,10);
    const stars=R.falls<=1?3:(R.falls<=3?2:1),bonus=stars*10;S.coins+=bonus;R.earned+=bonus;
    if(R.lv){S.stars[R.lv]=Math.max(S.stars[R.lv]||0,stars);if(LEVELS[R.lv].track==='r')S.cards[R.lv]=1}save();refreshHud();
    const isRule=R.lv&&LEVELS[R.lv].track==='r';
    setTimeout(()=>{$over.innerHTML=`<div class="res"><h2>${stars===3?'Без единой лавы!':stars===2?'Отлично прошла!':'Уровень пройден!'}</h2><div class="big3">${[1,2,3].map(i=>i<=stars?'<em>★</em>':'★').join('')}</div>
    <p><span class="pill" style="box-shadow:none;background:#f4f6fb"><span class="coin"></span>+${R.earned}</span></p>${isRule?`<p>Карта «${esc(LEVELS[R.lv].name)}» теперь твоя!</p>`:''}${R.falls?`<p>Падений в лаву: ${R.falls}</p>`:''}
    ${R.lv?`<button class="btn3d c1" data-do="lvl" data-v="${R.lv}">Ещё раз</button>`:''}<button class="btn3d c2" data-do="go" data-v="home">На карту</button></div>`;$over.style.display='flex'},520)
  }};
}
function towerOver(){
  G.phase='end';const P=G.P;P.fall=true;P.vy=-5;P.vx=0;P.spin=.01;P.cb=()=>{};$a.innerHTML='';$q.innerHTML='<div class="kicker">Лава догнала!</div>';
  const newBest=G.floors>S.best;if(newBest)S.best=G.floors;S.coins+=G.floors*2;G.R.earned+=G.floors*2;save();refreshHud();SFX.bad();
  setTimeout(()=>{if(!G)return;$over.innerHTML=`<div class="res"><h2>${newBest?'Новый рекорд!':'Лава догнала!'}</h2><div class="big3" style="color:var(--ink)">${G.floors}</div><p>этажей. Рекорд: ${S.best}</p><p><span class="pill" style="box-shadow:none;background:#f4f6fb"><span class="coin"></span>+${G.R.earned}</span></p><button class="btn3d c0" data-do="tower">Ещё раз</button><button class="btn3d c2" data-do="go" data-v="home">На карту</button></div>`;$over.style.display='flex'},900);
}

/* ===== СОБЫТИЯ ===== */
const ACT={
  go(v){confirmReset=false;G=null;showMenu(v)},
  lvl(v){G=null;startLevel(v)},tower(){G=null;startTower()},miss(){G=null;startMiss()},
  quit(){G=null;$over.style.display='none';showMenu('home')},
  snd(){S.snd=S.snd?0:1;save();refreshHud();if(S.snd)SFX.tap()},
  ans(v){answer(+v)},
  tile(v,el){tileTap(v,el)},
  next(){if(G&&G.phase==='explain'){if(G.mode==='tower'&&G.lava<G.P.y-.1)return towerOver();G.task&&G.task.pads&&G.task.pads.forEach(p=>p.fade=true);G.camX=0;nextStep()}},
  studied(){if(!G)return;if(G.tok){ask()}else nextStep()},
  buy(v){const i=SHOP.find(x=>x.id===v);if(!S.own[v]){if(S.coins<i.p)return;S.coins-=i.p;S.own[v]=1;SFX.coin()}else SFX.tap();S.eq[i.t]=v;save();showMenu('shop')},
  askreset(){confirmReset=true;showMenu('grown')},noreset(){confirmReset=false;showMenu('grown')},
  reset(){S=JSON.parse(JSON.stringify(DEF));save();confirmReset=false;showMenu('home')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;ACT[b.dataset.do](b.dataset.v,b)});
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='ask'||!G.task||G.task.kind!=='pick')return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;G.task.pads.forEach((p,i)=>{const px=SX(p.x-p.w/2),py=SY(p.y),w=p.w*V.u,h=(p.h+.3)*V.u;if(x>=px&&x<=px+w&&y>=py-.3*V.u&&y<=py+h)answer(i)})});
addEventListener('resize',()=>{if(play.style.display==='block')resize()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G)last=performance.now()});
document.addEventListener('gesturestart',e=>e.preventDefault());
window.OBBY={get G(){return G},get S(){return S},WORDS,LEVELS,ITEMS,RULES,GRAMMAR,WORD_LEVELS,ACT};
showMenu('home');
</script>
